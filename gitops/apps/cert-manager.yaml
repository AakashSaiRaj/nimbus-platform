apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  # Wait for resources to be deleted before this Application disappears
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.16.2  # pin chart version
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: true
        # Keep it small for dev
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1

  destination:
    server: https://kubernetes.default.svc  # this cluster
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true       # delete things removed from git
      selfHeal: true    # undo manual kubectl edits
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

